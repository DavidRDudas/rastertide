<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030023" />
    <meta
      name="description"
      content="Convert images and video into animated ASCII art, then export a PNG or WEBM."
    />
    <meta property="og:title" content="Raster Tide" />
    <meta property="og:description" content="Animated ASCII for images and video" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rastertide.com/" />
    <meta property="og:image" content="https://rastertide.com/og.png" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="915" />
    <meta property="og:image:alt" content="Raster Tide animated ASCII portrait" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Raster Tide" />
    <meta name="twitter:description" content="Animated ASCII for images and video" />
    <meta name="twitter:image" content="https://rastertide.com/og.png" />
    <link rel="canonical" href="https://rastertide.com/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>Raster Tide — Animated ASCII Generator</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("raster-tide-theme");
          const preferred = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
          document.documentElement.dataset.theme =
            saved === "dark" || saved === "light" ? saved : preferred;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Raster Tide requires JavaScript to render media in your browser.</noscript>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
